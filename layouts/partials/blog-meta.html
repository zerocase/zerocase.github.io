<div class="blog-meta">
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
    {{ .Date.Format "January 2, 2006" }}
  </time>
  {{- if .Params.authors }}
  <span class="authors">by {{ delimit .Params.authors ", " " and " }}</span>
  {{- end }}
  {{- if .Params.categories }}
  <span class="categories">in {{ delimit .Params.categories ", " " and " }}</span>
  {{- end }}
  {{- if .ReadingTime }}
  <span class="reading-time">{{ .ReadingTime }} min read</span>
  {{- end }}
</div>
