{{- if isset .Params "tags" -}}
  {{- $tagsLen := len .Params.tags -}}
  {{- if gt $tagsLen 0 -}}
<div class="blog-taglist">
  <span class="tag-label">Tagged with:</span>
  {{- range $k, $v := .Params.tags -}}
    {{- $url := printf "/tags/%s" (. | urlize | lower) -}}
  <a href="{{ $url | absURL }}" class="tag">{{ . | title }}</a>
  {{- end -}}
</div>
  {{- end -}}
{{- end }}
